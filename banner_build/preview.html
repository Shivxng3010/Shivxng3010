<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Profile Banner Preview - Shivang Soni</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #050811;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 24px;
      color: #22D3EE;
    }
    p {
      color: #94A3B8;
      margin-bottom: 30px;
    }
    .preview-card {
      margin-bottom: 40px;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 16px;
      background: #0A101F;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 1200px;
      width: 100%;
    }
    .preview-card.light-card {
      background: #E2E8F0;
      border-color: #CBD5E1;
    }
    .preview-card.light-card h2 {
      color: #0891B2;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #A78BFA;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Profile Terminal Banner — Phase 1 Preview</h1>
  <p>1180×610 Terminal · Floyd–Steinberg Serpentine Dither · Dual Phase (Intro + 14.2s Loop)</p>

  <div class="preview-card">
    <h2>Dark Mode (dark.svg)</h2>
    <img src="../dark.svg" alt="Dark Mode Banner" />
  </div>

  <div class="preview-card light-card">
    <h2>Light Mode (light.svg)</h2>
    <img src="../light.svg" alt="Light Mode Banner" />
  </div>
</body>
</html>
